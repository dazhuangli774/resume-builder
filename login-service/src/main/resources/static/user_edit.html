<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改用户</title>
  <style>
    body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .form-box { width: 400px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-item { margin-bottom: 15px; }
    label { display: inline-block; width: 80px; text-align: right; margin-right: 10px; }
    input, select { width: 220px; padding: 6px; border: 1px solid #d9d9d9; border-radius: 4px; }
    .btn-group { text-align: center; margin-top: 20px; }
    .btn { padding: 6px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 0 5px; }
    .btn-primary { background: #1890ff; color: #fff; }
    .btn-default { background: #fff; border: 1px solid #d9d9d9; }
  </style>
</head>

<script src="./js/vue.js"></script>
<script src="./js/axios-0.18.0.js"></script>

<body>
  <h1>修改用户</h1>
  
  <div id="app" class="form-box">
    <div class="form-item">
      <label>ID：</label>
      <input v-model="user.id" disabled>
    </div>
    <div class="form-item">
      <label>用户名：</label>
      <input v-model="user.username">
    </div>
    <div class="form-item">
      <label>邮箱：</label>
      <input v-model="user.email">
    </div>
    <div class="form-item">
      <label>电话：</label>
      <input v-model="user.phone">
    </div>
    <div class="form-item">
      <label>角色：</label>
      <select v-model="user.role">
        <option value="admin">管理员</option>
        <option value="user">普通用户</option>
      </select>
    </div>
    <div class="form-item">
      <label>状态：</label>
      <select v-model="user.status">
        <option value="1">启用</option>
        <option value="0">禁用</option>
      </select>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" @click="submit">保存</button>
      <button class="btn btn-default" @click="goBack">返回</button>
    </div>
  </div>
</body>

<script>
  new Vue({
    el: "#app",
    data() {
      return {
        user: {
          id: null,
          username: '',
          email: '',
          phone: '',
          role: 'user',
          status: 1
        }
      }
    },
    mounted() {
      const urlParams = new URLSearchParams(location.search);
      const id = urlParams.get('id');
      
      axios.get('/api/users/' + id).then(res => {
        if(res.data.code === 1 && res.data.data){
          this.user = res.data.data;
          this.user.status = Number(this.user.status);
        }
      });
    },
    methods: {
      submit() {
        axios.put('/api/users/' + this.user.id, this.user)
          .then(res => {
            alert("修改成功");
            location.href = 'user_list.html';
          });
      },
      goBack() {
        location.href = 'user_list.html';
      }
    }
  });
</script>
</html>
