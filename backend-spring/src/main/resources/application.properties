spring.application.name=resume
server.port=8080

# ---------------- 数据库 ----------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/resume?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---------------- JWT ----------------
# 生产请通过环境变量 JWT_SECRET 注入，不要使用默认值
jwt.secret=${JWT_SECRET:your_secret_key_123456}
jwt.expire=86400000

# ---------------- DeepSeek ----------------
# 留空则自动降级为本地模拟（界面可跑，返回占位文案）
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.timeout-seconds=60
